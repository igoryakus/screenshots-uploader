name: macOS app

on:
  push:
    branches: [main]
    paths: ["macos-app/**", ".github/workflows/macos-app.yml"]
  pull_request:
    paths: ["macos-app/**", ".github/workflows/macos-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos-app
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Build ShotHost.app
        run: ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ShotHost
          path: macos-app/build/ShotHost.zip
