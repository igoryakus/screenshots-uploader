<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c94ff"/>
      <stop offset="1" stop-color="#0b4fc9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062a6e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Плитка в пропорциях иконок macOS: 824×824 с отступом 100 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  </g>
  <g filter="url(#glyph)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Рамка видоискателя -->
    <g stroke-width="44">
      <path d="M262 382 V322 a60 60 0 0 1 60 -60 H382"/>
      <path d="M642 262 H702 a60 60 0 0 1 60 60 V382"/>
      <path d="M762 642 V702 a60 60 0 0 1 -60 60 H642"/>
      <path d="M382 762 H322 a60 60 0 0 1 -60 -60 V642"/>
    </g>
    <!-- Стрелка загрузки -->
    <g stroke-width="56">
      <path d="M512 650 V390"/>
      <path d="M408 486 L512 382 L616 486"/>
    </g>
  </g>
</svg>
